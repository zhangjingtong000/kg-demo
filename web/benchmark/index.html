<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KG 性能基准器</title><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script><style>body{margin:0;background:#070c13;color:#dce9f7;font:14px Inter,system-ui}header{padding:14px 20px;border-bottom:1px solid #1c3044;display:flex;gap:12px;align-items:center;flex-wrap:wrap}select,button{background:#112235;color:#dce9f7;border:1px solid #34506a;border-radius:7px;padding:7px 9px}button{cursor:pointer}#stage{height:calc(100vh - 195px);min-height:440px;position:relative}.benchmark-labels{position:absolute;inset:0;pointer-events:none}.node-label{font-size:10px;color:#dce9f7;text-shadow:0 0 7px #000;white-space:nowrap}#report{margin:0;padding:12px 20px;background:#0c1724;border-top:1px solid #1c3044;white-space:pre-wrap;min-height:65px}.pass{color:#6ee7b7}.reserve-warning{color:#fde68a}.fail{color:#fca5a5}</style></head><body><header><strong>KG 性能基准器</strong><label>档位 <select id="profile"><option value="legacy">Legacy · 26 / 55</option><option value="localDense">Local Dense · 80 / 320</option><option value="communityBrowse">Community Browse · 250 / 1200</option></select></label><label>DPR <select id="dpr"><option value="1">1</option><option value="2">2</option><option value="native">native</option></select></label><button data-scenario="idle">静态</button><button data-scenario="orbit">旋转</button><button data-scenario="focus">聚焦</button><button data-scenario="drag-edge-refresh">拖拽边刷新</button><button data-scenario="ui-reserve">UI 预留</button></header><main id="stage"></main><pre id="report" aria-live="polite">选择场景后开始 8 秒采样。</pre><script type="module">import{createFixture}from'./lib/graph-fixtures.mjs';import{createBenchmarkCollector}from'./lib/metrics.mjs';import{classifyReport}from'./lib/classification.mjs';import{createBenchmarkScene}from'./lib/benchmark-scene.mjs';const stage=document.querySelector('#stage'),report=document.querySelector('#report'),profile=document.querySelector('#profile'),dpr=document.querySelector('#dpr');let active;async function run(scenario){active?.dispose();const pixelRatio=dpr.value==='native'?devicePixelRatio:Number(dpr.value);active=createBenchmarkScene({container:stage,fixture:createFixture(profile.value),pixelRatio});active.startScenario(scenario);if(scenario==='ui-reserve'){stage.style.marginRight='360px';setTimeout(()=>stage.style.marginRight='0',900)}const collector=createBenchmarkCollector({warmupMs:1000,sampleMs:8000});collector.start();report.textContent='采样中…';await new Promise(resolve=>{const wait=()=>collector.isComplete()?resolve():requestAnimationFrame(wait);wait()});const stats=active.getRendererStats();const data=collector.finish(stats.renderer,stats.firstRenderMs);data.profile=profile.value;data.scenario=scenario;data.classification=classifyReport(data);report.className=data.classification;report.textContent=JSON.stringify(data,null,2)}document.querySelectorAll('[data-scenario]').forEach(button=>button.onclick=()=>run(button.dataset.scenario));</script></body></html>
