<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KG × Cosmos</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#000 url(bg_space.jpg) center/cover no-repeat fixed;
  overflow:hidden;height:100vh;
  font-family:"Inter","PingFang SC",system-ui,sans-serif;
}
canvas{display:block}
.hint{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.25);font-size:11px;letter-spacing:.05em;pointer-events:none}
</style></head><body>
<div class="hint">drag to rotate | scroll to zoom | click node to focus</div>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {CSS2DRenderer,CSS2DObject} from 'three/addons/renderers/CSS2DRenderer.js';

const W=innerWidth,H=innerHeight;
const scene=new THREE.Scene();
// No scene.background — let the CSS background show through
const camera=new THREE.PerspectiveCamera(45,W/H,.5,200);
camera.position.set(0,10,20);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setSize(W,H);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setClearColor(0x000000,0); // fully transparent
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
document.body.appendChild(renderer.domElement);

const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(W,H);labelRenderer.domElement.style.position='absolute';labelRenderer.domElement.style.top='0';labelRenderer.domElement.style.pointerEvents='none';
document.body.appendChild(labelRenderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.08;controls.minDistance=4;controls.maxDistance=50;
controls.autoRotate=true;controls.autoRotateSpeed=.25;controls.target.set(0,0,0);

scene.add(new THREE.AmbientLight('#334466',.7));
const key=new THREE.DirectionalLight('#ffffff',2);key.position.set(15,20,10);scene.add(key);
scene.add(new THREE.DirectionalLight('#8899cc',1));

// === KNOWLEDGE GRAPH ===
const graphData=[
  {pos:[-8,6,-3],r:.6,color:'#e8c170',label:'Deadlift'},
  {pos:[-5,9,2],r:.55,color:'#7db8d4',label:'Hip Flexor'},
  {pos:[-1,11,-4],r:.62,color:'#c9a0dc',label:'Core Stability'},
  {pos:[4,10,1],r:.5,color:'#88c9a0',label:'Shoulder Press'},
  {pos:[9,7,3],r:.64,color:'#e8a870',label:'Bench Press'},
  {pos:[8,2,-4],r:.56,color:'#d4a0b0',label:'Triceps'},
  {pos:[5,-3,5],r:.48,color:'#90b0d8',label:'Biceps Curl'},
  {pos:[-1,-6,1],r:.66,color:'#c0b890',label:'Squat'},
  {pos:[-8,-2,6],r:.58,color:'#a8c8b0',label:'Quadriceps'},
  {pos:[-11,2,-3],r:.52,color:'#d0b8c8',label:'Lower Back'},
  {pos:[-4,-1,-8],r:.6,color:'#b8c0d8',label:'Glutes'},
  {pos:[7,-6,-2],r:.54,color:'#c8b8a0',label:'Hamstrings'},
  {pos:[-5,4,9],r:.5,color:'#a0c0c8',label:'Lat Pulldown'},
  {pos:[3,2,10],r:.56,color:'#c8a8b8',label:'Romanian DL'},
  {pos:[-9,-6,-5],r:.46,color:'#98b8c8',label:'Calves'},
  {pos:[11,-2,7],r:.58,color:'#e8d488',label:'Overhead Press'},
  {pos:[-11,8,6],r:.52,color:'#c0a0e0',label:'Pull-up'},
  {pos:[0,-10,-3],r:.62,color:'#d8c090',label:'Leg Press'},
  {pos:[12,1,-7],r:.54,color:'#e0a8b0',label:'Chest Fly'},
  {pos:[-6,-9,7],r:.5,color:'#b8d0c0',label:'Lunges'},
  {pos:[8,8,8],r:.48,color:'#d0c8e8',label:'Face Pull'},
  {pos:[-9,-1,11],r:.56,color:'#e8c888',label:'Hip Thrust'},
  {pos:[1,7,-11],r:.58,color:'#c8b0d0',label:'Plank'},
  {pos:[10,-9,0],r:.52,color:'#a8d8c8',label:'Calf Raise'},
  {pos:[-13,-4,8],r:.48,color:'#d8b8a0',label:'Good Morning'},
  {pos:[5,5,-10],r:.54,color:'#b8a8d8',label:'Russian Twist'},
];
const edges=[[0,1],[0,9],[0,10],[0,14],[1,2],[2,3],[2,16],[3,4],[4,5],[4,20],[5,6],[6,7],[7,8],[7,17],[8,9],[10,7],[10,11],[11,23],[5,12],[6,12],[8,12],[11,14],[9,14],[3,13],[13,5],[12,21],[12,14],[1,8],[10,14],[15,4],[15,18],[15,5],[16,3],[16,20],[17,7],[17,11],[17,14],[8,19],[19,11],[19,14],[19,17],[0,25],[1,21],[2,22],[3,24],[4,23],[5,18],[6,20],[20,16],[21,13],[21,25],[22,16],[22,17],[7,23],[23,18],[23,10],[24,9],[24,8],[24,17],[25,12],[25,22],[25,0],[10,24],[11,19],[15,20]];

function makeGlassMat(color){
  const c=new THREE.Color(color),h={};c.getHSL(h);const gc=new THREE.Color().setHSL(h.h,h.s*.6,Math.min(1,h.l*1.35));
  return new THREE.ShaderMaterial({uniforms:{uColor:{value:gc},uLightDir:{value:new THREE.Vector3(.55,.7,.4).normalize()},uLightDir2:{value:new THREE.Vector3(-.3,-.15,-.35).normalize()},uCameraPos:{value:new THREE.Vector3()}},
    vertexShader:`varying vec3 vWPos,vWNormal;void main(){vec4 wp=modelMatrix*vec4(position,1.);vWPos=wp.xyz;vWNormal=normalize(mat3(modelMatrix)*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader:`varying vec3 vWPos,vWNormal;uniform vec3 uColor,uLightDir,uLightDir2,uCameraPos;
void main(){vec3 N=normalize(vWNormal),V=normalize(uCameraPos-vWPos);float f=pow(1.-abs(dot(V,N)),3.5);
vec3 H1=normalize(uLightDir+V),H2=normalize(uLightDir2+V);float s1=pow(max(dot(N,H1),0.),180.),s2=pow(max(dot(N,H2),0.),80.);
float d=max(dot(N,uLightDir),0.)*.25+.1;vec3 body=uColor*(d+.35);float ba=.12;vec3 edge=uColor*2.2*f;float ea=f*.4;float sp=s1*.85+s2*.45;
gl_FragColor=vec4(body+edge+sp*vec3(1.),clamp(ba+ea+sp*.85,0.,1.));}`,
    transparent:true,depthWrite:true});
}

const nodeMeshes=[],nodeGroup=new THREE.Group();
graphData.forEach((d,i)=>{
  const g=new THREE.SphereGeometry(d.r,48,48),m=new THREE.Mesh(g,makeGlassMat(d.color));
  m.position.set(...d.pos);m.userData={idx:i};
  const gg=new THREE.SphereGeometry(d.r*1.9,16,16);
  const gm=new THREE.ShaderMaterial({uniforms:{uColor:{value:new THREE.Color(d.color)}},
    vertexShader:`varying vec3 vN,vP;void main(){vec4 wp=modelMatrix*vec4(position,1.);vP=wp.xyz;vN=normalize(mat3(modelMatrix)*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader:`varying vec3 vN,vP;uniform vec3 uColor;void main(){vec3 V=normalize(cameraPosition-vP);float f=1.-abs(dot(V,vN));gl_FragColor=vec4(uColor,f*f*.22);}`,
    transparent:true,depthWrite:false});
  m.add(new THREE.Mesh(gg,gm));nodeGroup.add(m);nodeMeshes.push({mesh:m,data:d,idx:i});
});
scene.add(nodeGroup);

// Connections
function createBeam(p1,p2,c1,c2,rm,segs){
  const dir=new THREE.Vector3().subVectors(p2,p1),len=dir.length();dir.normalize();
  const up=new THREE.Vector3(0,1,0);if(Math.abs(dir.dot(up))>.999)up.set(1,0,0);
  const rv=new THREE.Vector3().crossVectors(dir,up).normalize(),fw=new THREE.Vector3().crossVectors(rv,dir).normalize();
  const R=6,pos=[],cols=[],idx=[];for(let i=0;i<=segs;i++){const t=i/segs,ct=p1.clone().add(dir.clone().multiplyScalar(t*len)),rad=rm*(.78+.22*Math.sin(t*Math.PI)),mc=c1.clone().lerp(c2,t),b=Math.sin(t*Math.PI);for(let j=0;j<R;j++){const a=j/R*Math.PI*2;pos.push(ct.x+rv.x*Math.cos(a)*rad+fw.x*Math.sin(a)*rad,ct.y+rv.y*Math.cos(a)*rad+fw.y*Math.sin(a)*rad,ct.z+rv.z*Math.cos(a)*rad+fw.z*Math.sin(a)*rad);cols.push(mc.r*b,mc.g*b,mc.b*b);}}
  for(let i=0;i<segs;i++)for(let j=0;j<R;j++){const a=i*R+j,b=i*R+((j+1)%R),c=(i+1)*R+j,d=(i+1)*R+((j+1)%R);idx.push(a,b,c);idx.push(b,d,c);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));g.setIndex(idx);g.computeVertexNormals();return g;
}
const connGroup=new THREE.Group();
edges.forEach(([f,t])=>{const p1=new THREE.Vector3(...graphData[f].pos),p2=new THREE.Vector3(...graphData[t].pos);const c1=new THREE.Color(graphData[f].color),c2=new THREE.Color(graphData[t].color);const mg=createBeam(p1,p2,c1,c2,.022,40);connGroup.add(new THREE.Mesh(mg,new THREE.MeshBasicMaterial({vertexColors:true,transparent:true,opacity:.45,blending:THREE.AdditiveBlending,depthWrite:false})));const cg=createBeam(p1,p2,c1,c2,.032,30);connGroup.add(new THREE.Mesh(cg,new THREE.MeshBasicMaterial({vertexColors:true,transparent:true,opacity:.25,blending:THREE.AdditiveBlending,depthWrite:false})));});
scene.add(connGroup);

// Render
const clock=new THREE.Clock();
function anim(){
  requestAnimationFrame(anim);
  controls.update();
  nodeMeshes.forEach(({mesh})=>{if(mesh.material.uniforms)mesh.material.uniforms.uCameraPos.value.copy(camera.position);});
  renderer.render(scene,camera);labelRenderer.render(scene,camera);
}anim();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);});
</script></body></html>
