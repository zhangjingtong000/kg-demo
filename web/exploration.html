<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识图谱探索</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  .layer { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  .background-layer { z-index: 0; pointer-events: none; }
  .graph-layer { z-index: 1; background: transparent; }
  .show-guides::before, .show-guides::after { content: ""; position: fixed; z-index: 2; pointer-events: none; opacity: 0.75; }
  .show-guides::before { top: 0; bottom: 0; left: 50vw; width: 1px; background: rgba(255, 96, 128, 0.9); }
  .show-guides::after { left: 0; right: 0; top: 50vh; height: 1px; background: rgba(255, 96, 128, 0.9); }
</style>
</head>
<body>
  <iframe class="layer background-layer" title="深空背景" src="../assets/deep-space-galaxy.html?passive=1"></iframe>
  <iframe class="layer graph-layer" title="知识图谱" src="index3d-bounce.html?transparentBackground=1"></iframe>
  <script>
    const params = new URLSearchParams(location.search);
    if (params.get('guides') === '1') {
      document.body.classList.add('show-guides');
    }
    const benchmark = params.get('benchmark');
    if (/^S[0-4]$/.test(benchmark ?? '')) {
      const seed = params.get('seed');
      const graphUrl = `index3d-bounce.html?transparentBackground=1&benchmark=${encodeURIComponent(benchmark)}`;
      document.querySelector('.graph-layer').src = Number.isInteger(Number(seed))
        ? `${graphUrl}&seed=${encodeURIComponent(seed)}`
        : graphUrl;
    }
    const runtimeGraph = params.get('graph');
    if (runtimeGraph) {
      const graphUrl = `index3d-bounce.html?transparentBackground=1&graph=${encodeURIComponent(runtimeGraph)}`;
      document.querySelector('.graph-layer').src = graphUrl;
    }
  </script>
</body>
</html>
